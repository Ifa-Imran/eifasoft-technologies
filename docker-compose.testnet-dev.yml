# =====================================================================
# KAIRO DAO — Testnet stack for dev.kairodao.com (opBNB chainId 5611)
# =====================================================================
# Runs SIDE-BY-SIDE with the existing kairo-dev mainnet stack.
# - Joins the existing external network `kairo-dev_kairo_network` so the
#   already-running Traefik (from docker-compose.vps.yml) can route us.
# - All services use distinct names; the existing mainnet containers are
#   NOT touched.
# - Recommended project name on `docker compose -p`: kairo-testnet
# =====================================================================

services:
  postgres-testnet:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kairo_admin
      POSTGRES_PASSWORD: K41r0T3st2026!
      POSTGRES_DB: kairo_testnet
    volumes:
      - postgres_testnet_data:/var/lib/postgresql/data
    networks:
      - kairo_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kairo_admin -d kairo_testnet"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-testnet:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass K41r0T3stR3d1s! --appendonly yes
    volumes:
      - redis_testnet_data:/data
    networks:
      - kairo_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "K41r0T3stR3d1s!", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-testnet:
    image: node:18-alpine
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "
        apk add --no-cache git &&
        rm -rf /tmp/repo &&
        git clone --branch testnet-dev --depth 1 https://github.com/Ifa-Imran/eifasoft-technologies.git /tmp/repo &&
        cp -a /tmp/repo/backend/. /app/ &&
        NODE_ENV=development npm ci &&
        npx tsc &&
        mkdir -p dist/db/migrations && cp src/db/migrations/*.sql dist/db/migrations/ &&
        node dist/db/migrate.js &&
        NODE_ENV=production node dist/index.js
      "
    environment:
      - PORT=4000
      - DATABASE_URL=postgresql://kairo_admin:K41r0T3st2026!@postgres-testnet:5432/kairo_testnet
      - REDIS_URL=redis://:K41r0T3stR3d1s!@redis-testnet:6379
      - RPC_URL=https://opbnb-testnet-rpc.bnbchain.org
      - RPC_WS_URL=wss://opbnb-testnet-rpc.bnbchain.org
      - CHAIN_ID=5611
      - KAIRO_TOKEN_ADDRESS=0x611B2c50E0BCcC99E5632c569431C39983126287
      - LIQUIDITY_POOL_ADDRESS=0xf8BAd518660f515443D58dF0b56C826e111A443f
      - STAKING_MANAGER_ADDRESS=0x5eADF2F4Ac87EAa2fAA5aBCA74BBab98bC7B843f
      - AFFILIATE_DISTRIBUTOR_ADDRESS=0x530Ade1d4E3E757214E3E2bc0633b973621216F9
      - CMS_ADDRESS=0x995B0545677150d8d5Fa6374730FcB4cD400ba88
      - ATOMIC_P2P_ADDRESS=0xD1ff5759206BA1468C393059d9A5205bB952953F
      - USDT_ADDRESS=0xE6eab343b44B1D1Ccd8fFbf545a6e3e2425c7a18
      - SYSTEM_WALLET=0x624D0985D844Cd1DF132723a9d849FE1A34cAf9D
      # Block at which the testnet contracts were deployed; backfill from here.
      - DEPLOYMENT_BLOCK=${DEPLOYMENT_BLOCK_TESTNET:-161143000}
      # Indexer signing key (only needed if backend posts on-chain txs)
      - INDEXER_PRIVATE_KEY=${INDEXER_PRIVATE_KEY_TESTNET:-}
    volumes:
      - backend_testnet_app:/app
    depends_on:
      postgres-testnet:
        condition: service_healthy
      redis-testnet:
        condition: service_healthy
    networks:
      - kairo_network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=kairo-dev_kairo_network"
      # API
      - "traefik.http.routers.kairo-testnet-api.rule=Host(`dev.kairodao.com`) && PathPrefix(`/api`)"
      - "traefik.http.routers.kairo-testnet-api.entrypoints=websecure"
      - "traefik.http.routers.kairo-testnet-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.kairo-testnet-api.service=kairo-testnet-backend"
      - "traefik.http.routers.kairo-testnet-api.priority=20"
      # WS
      - "traefik.http.routers.kairo-testnet-ws.rule=Host(`dev.kairodao.com`) && PathPrefix(`/ws`)"
      - "traefik.http.routers.kairo-testnet-ws.entrypoints=websecure"
      - "traefik.http.routers.kairo-testnet-ws.tls.certresolver=letsencrypt"
      - "traefik.http.routers.kairo-testnet-ws.service=kairo-testnet-backend"
      - "traefik.http.routers.kairo-testnet-ws.priority=20"
      # Health
      - "traefik.http.routers.kairo-testnet-health.rule=Host(`dev.kairodao.com`) && PathPrefix(`/health`)"
      - "traefik.http.routers.kairo-testnet-health.entrypoints=websecure"
      - "traefik.http.routers.kairo-testnet-health.tls.certresolver=letsencrypt"
      - "traefik.http.routers.kairo-testnet-health.service=kairo-testnet-backend"
      - "traefik.http.routers.kairo-testnet-health.priority=20"
      - "traefik.http.services.kairo-testnet-backend.loadbalancer.server.port=4000"

  frontend-testnet:
    image: node:18-alpine
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "
        apk add --no-cache git &&
        rm -rf /tmp/repo &&
        git clone --branch testnet-dev --depth 1 https://github.com/Ifa-Imran/eifasoft-technologies.git /tmp/repo &&
        cp -a /tmp/repo/frontend/. /app/ &&
        rm -f /app/.env /app/.env.local /app/.env.production /app/.env.production.local &&
        rm -rf /app/.next /app/node_modules/.cache &&
        npm ci --legacy-peer-deps &&
        npm run build &&
        rm -rf /app/.next/standalone/.next/static /app/.next/standalone/public &&
        cp -r .next/static .next/standalone/.next/static &&
        cp -r public .next/standalone/public &&
        NODE_ENV=production node .next/standalone/server.js
      "
    environment:
      - NEXT_PUBLIC_BACKEND_URL=https://dev.kairodao.com
      - NEXT_PUBLIC_WS_URL=wss://dev.kairodao.com/ws
      - NEXT_PUBLIC_CHAIN_ID=5611
      - NEXT_PUBLIC_RPC_URL=https://opbnb-testnet-rpc.bnbchain.org
      - NEXT_PUBLIC_EXPLORER_URL=https://opbnb-testnet.bscscan.com
      - NEXT_PUBLIC_KAIRO_TOKEN=0x611B2c50E0BCcC99E5632c569431C39983126287
      - NEXT_PUBLIC_LIQUIDITY_POOL=0xf8BAd518660f515443D58dF0b56C826e111A443f
      - NEXT_PUBLIC_STAKING_MANAGER=0x5eADF2F4Ac87EAa2fAA5aBCA74BBab98bC7B843f
      - NEXT_PUBLIC_AFFILIATE_DISTRIBUTOR=0x530Ade1d4E3E757214E3E2bc0633b973621216F9
      - NEXT_PUBLIC_CMS=0x995B0545677150d8d5Fa6374730FcB4cD400ba88
      - NEXT_PUBLIC_ATOMIC_P2P=0xD1ff5759206BA1468C393059d9A5205bB952953F
      - NEXT_PUBLIC_USDT=0xE6eab343b44B1D1Ccd8fFbf545a6e3e2425c7a18
      - NEXT_PUBLIC_SYSTEM_WALLET=0x624D0985D844Cd1DF132723a9d849FE1A34cAf9D
      - NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID=d9fddb48789291a159e8270ef32105c2
    volumes:
      - frontend_testnet_app:/app
    depends_on:
      - backend-testnet
    networks:
      - kairo_network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=kairo-dev_kairo_network"
      - "traefik.http.routers.kairo-testnet-frontend.rule=Host(`dev.kairodao.com`)"
      - "traefik.http.routers.kairo-testnet-frontend.entrypoints=websecure"
      - "traefik.http.routers.kairo-testnet-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.kairo-testnet-frontend.loadbalancer.server.port=3000"
      - "traefik.http.routers.kairo-testnet-frontend.priority=10"

volumes:
  postgres_testnet_data:
  redis_testnet_data:
  backend_testnet_app:
  frontend_testnet_app:

networks:
  kairo_network:
    external: true
    name: kairo-dev_kairo_network
