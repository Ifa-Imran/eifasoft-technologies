services:
  postgres:
    image: timescale/timescaledb:latest-pg14
    restart: unless-stopped
    environment:
      POSTGRES_USER: kairo_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: kairo_prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kairo_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kairo_admin -d kairo_prod"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - kairo_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: kairoprotocol-backend
    pull_policy: never
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://kairo_admin:${DB_PASSWORD}@postgres:5432/kairo_prod
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - RPC_URL=${RPC_URL}
      - RPC_WS_URL=${RPC_WS_URL}
      - CHAIN_ID=${CHAIN_ID}
      - INDEXER_PRIVATE_KEY=${INDEXER_PRIVATE_KEY}
      - KAIRO_TOKEN_ADDRESS=${KAIRO_TOKEN_ADDRESS}
      - LIQUIDITY_POOL_ADDRESS=${LIQUIDITY_POOL_ADDRESS}
      - STAKING_MANAGER_ADDRESS=${STAKING_MANAGER_ADDRESS}
      - AFFILIATE_DISTRIBUTOR_ADDRESS=${AFFILIATE_DISTRIBUTOR_ADDRESS}
      - CMS_ADDRESS=${CMS_ADDRESS}
      - ATOMIC_P2P_ADDRESS=${ATOMIC_P2P_ADDRESS}
      - SYSTEM_WALLET=${SYSTEM_WALLET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kairo_network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=kairoprotocol_kairo_network"
      - "traefik.http.routers.kairoprotocol-api.rule=(Host(`kairoprotocol.com`) || Host(`dev.kairoprotocol.com`)) && PathPrefix(`/api`)"
      - "traefik.http.routers.kairoprotocol-api.entrypoints=websecure"
      - "traefik.http.routers.kairoprotocol-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.kairoprotocol-api.loadbalancer.server.port=4000"
      - "traefik.http.routers.kairoprotocol-ws.rule=(Host(`kairoprotocol.com`) || Host(`dev.kairoprotocol.com`)) && PathPrefix(`/ws`)"
      - "traefik.http.routers.kairoprotocol-ws.entrypoints=websecure"
      - "traefik.http.routers.kairoprotocol-ws.tls.certresolver=letsencrypt"
      - "traefik.http.services.kairoprotocol-ws.loadbalancer.server.port=4000"
      - "traefik.http.routers.kairoprotocol-health.rule=(Host(`kairoprotocol.com`) || Host(`dev.kairoprotocol.com`)) && PathPrefix(`/health`)"
      - "traefik.http.routers.kairoprotocol-health.entrypoints=websecure"
      - "traefik.http.routers.kairoprotocol-health.tls.certresolver=letsencrypt"
      - "traefik.http.services.kairoprotocol-health.loadbalancer.server.port=4000"

  frontend:
    image: kairoprotocol-frontend
    pull_policy: never
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - kairo_network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=kairoprotocol_kairo_network"
      - "traefik.http.routers.kairoprotocol-frontend.rule=Host(`kairoprotocol.com`) || Host(`www.kairoprotocol.com`) || Host(`dev.kairoprotocol.com`)"
      - "traefik.http.routers.kairoprotocol-frontend.entrypoints=websecure"
      - "traefik.http.routers.kairoprotocol-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.kairoprotocol-frontend.loadbalancer.server.port=3000"
      - "traefik.http.routers.kairoprotocol-frontend.priority=1"

volumes:
  postgres_data:
  redis_data:

networks:
  kairo_network:
    driver: bridge
